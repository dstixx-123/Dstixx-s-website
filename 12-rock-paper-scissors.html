<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="12-rock-paper-scissors.css">
</head>

<body>
    <p class="main-paragraph">
        Rock Paper Scissors
    </p>
    <button class="rock-button">
        <img src="images-icons/rock-emoji.png" alt="" class="rock-move">
    </button>

    <button class="paper-button">
        <img src="images-icons/paper-emoji.png" alt="" class="paper-move">
    </button>

    <button class="scissors-button">
        <img src="images-icons/scissors-emoji.png" alt="" class="scissors-move">
    </button>

    <p class="result-paragraph" class="result-css"></p>

    <p class="moves-paragraph">
    </p>

    <p class="score-paragraph score-css"></p>
    <button onclick="
    score.Wins = 0;
    score.Losses = 0;
    score.Ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();
    " class="reset-css">
        Reset Score</button>

    <button class="auto" onclick="
    autoPlay();
    ">
        Auto Play
    </button>


    <script>
        // let score = JSON.parse(localStorage.getItem('score')); // This code basically changes the score string into an object
        // the score object was formerly like this: const score = {
        // Wins: 0,
        // Ties: 0,
        // Losses: 0}

        const score = {
            Wins: 0,
            Ties: 0,
            Losses: 0
        }
        updateScoreElement();

        if (!score) {
            score = {
                Wins: 0,
                Losses: 0,
                Ties: 0
            }
        }


        let isAutoPlaying = false;
        let intervalId;
        function autoPlay() {
            if (!isAutoPlaying) {
                intervalId = setInterval(function () {
                    const playerMove = pickComputerMove();
                    playGame(playerMove);
                }, 1000);
                isAutoPlaying = true;
            } else {
                clearInterval(intervalId);
                isAutoPlaying = false;
            }
        }

        document.querySelector('.rock-button').addEventListener('click', (event) => {
            playGame('Rock');
        });

        document.querySelector('.paper-button').addEventListener('click', (event) => {
            playGame('Paper');
        });

        document.querySelector('.scissors-button').addEventListener('click', (event) => {
            playGame('Scissors');
        });

        document.body.addEventListener('keydown', (event) => {
            if (event.key === 'r' || event.key === 'R') {
                playGame('Rock');
            } else if (event.key === 'p' || event.key === 'P') {
                playGame('Paper');
            } else if (event.key === 's' || event.key === 'S') {
                playGame('Scissors');
            }
        })

        function playGame(playerMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (playerMove === 'Scissors') {
                if (computerMove === 'Rock') {
                    result = 'You Lose.';
                } else if (computerMove === 'Paper') {
                    result = 'You Win.'
                } else if (computerMove === 'Scissors') {
                    result = 'Tie.'
                }

            } else if (playerMove === 'Paper') {
                if (computerMove === 'Rock') {
                    result = 'You Win.'
                } else if (computerMove === 'Paper') {
                    result = 'Tie.'
                } else if (computerMove === 'Scissors') {
                    result = 'You Lose.'
                }

            } else if (playerMove === 'Rock') {
                if (computerMove === 'Rock') {
                    result = 'Tie.';
                } else if (computerMove === 'Paper') {
                    result = 'You Lose.';
                } else if (computerMove === 'Scissors') {
                    result = 'You Win.';
                }
            }

            if (result === 'You Win.') {
                score.Wins += 1;
            } else if (result === 'You Lose.') {
                score.Losses += 1;
            } else if (result === 'Tie.') {
                score.Ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score)); //JSON.stringify changes an object to a string, while JSON.parse changes a string to an object
            updateScoreElement();

            document.querySelector('.result-paragraph').innerHTML = result;

            document.querySelector('.moves-paragraph').innerHTML = `You
        <img src="images-icons/${playerMove}-emoji.png" alt="" class="rock-move">
        <img src="images-icons/${computerMove}-emoji.png" alt="" class="scissors-move">
        Computer`
            //             alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
            // Wins: ${score.Wins}, Losses: ${score.Losses}, Ties: ${score.Ties}`);
        }

        function updateScoreElement() {
            document.querySelector('.score-paragraph').innerHTML = `Wins: ${score.Wins}, Losses: ${score.Losses}, Ties: ${score.Ties}`;
        }

        function pickComputerMove() {
            const randomNumber = Math.random();

            let computerMove = '';
            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'Rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'Paper';
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'Scissors';
            }
            return computerMove;
        }

    </script>
</body>

</html>
